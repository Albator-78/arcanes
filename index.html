<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Grand Tirage des Trois Arcanes</title>
  <style>
    :root {
      --bg-deep: #0b0c12;
      --bg-card: #151722;
      --bg-panel: #12131c;
      --gold: #d4af37;
      --gold-light: #f3d77f;
      --gold-dim: rgba(212, 175, 55, 0.25);
      --text-main: #eae6df;
      --text-muted: #98938a;
      --c-frag1: #f4b8c8; /* Rose pâle - Sujet */
      --c-frag2: #f5d67b; /* Or clair - Action/Objet */
      --c-frag3: #a8d8ea; /* Bleu glacier - Circonstance */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: radial-gradient(circle at 50% 15%, #191c2b 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.2rem 4rem;
      line-height: 1.6;
    }

    header {
      text-align: center;
      max-width: 680px;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.05rem;
    }

    /* ── CONTRÔLES ── */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.06em;
      padding: 0.85rem 1.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    #draw-btn {
      background: linear-gradient(135deg, #b89225 0%, var(--gold) 100%);
      color: #0b0c12;
      border: 1px solid var(--gold-light);
      font-weight: bold;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.25);
    }

    #draw-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4);
    }

    #draw-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #reset-btn {
      display: none;
      background: transparent;
      color: var(--gold-light);
      border: 1px solid var(--gold-dim);
    }

    #reset-btn:hover {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.08);
    }

    /* ── TABLE DE TIRAGE ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(210px, 240px));
      gap: 1.8rem;
      max-width: 820px;
      width: 100%;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    @media (max-width: 740px) {
      .board {
        grid-template-columns: 1fr;
        max-width: 300px;
      }
    }

    .slot-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slot-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .card-slot {
      width: 100%;
      aspect-ratio: 2 / 3.2;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .card-slot.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-back,
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      border: 1px solid var(--gold-dim);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      text-align: center;
    }

    /* Dos de la carte */
    .card-back {
      background:
        radial-gradient(circle at center, rgba(212, 175, 55, 0.14) 0%, transparent 65%),
        repeating-linear-gradient(45deg, #131624 0px, #131624 8px, #181b2c 8px, #181b2c 16px);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .card-back::after {
      content: "✦";
      font-size: 2.2rem;
      color: var(--gold);
      opacity: 0.75;
    }

    /* Face de la carte */
    .card-face {
      background: linear-gradient(160deg, #1b1e2e 0%, var(--bg-card) 100%);
      transform: rotateY(180deg);
      justify-content: space-between;
      border: 1px solid rgba(212, 175, 55, 0.45);
    }

    .card-roman {
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .card-symbol {
      font-size: 3.4rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .card-title {
      font-size: 1.08rem;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
    }

    /* Fragment sous chaque carte */
    .card-fragment {
      margin-top: 0.9rem;
      min-height: 1.6em;
      font-size: 0.98rem;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s ease 0.25s, transform 0.45s ease 0.25s;
    }

    .card-slot.flipped + .card-fragment {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── COULEURS GRAMMATICALES ── */
    .frag-1 {
      color: var(--c-frag1);
      font-style: italic;
    }

    .frag-2 {
      color: var(--c-frag2);
      font-weight: bold;
    }

    .frag-3 {
      color: var(--c-frag3);
      font-style: italic;
    }

    /* ── SYNTHÈSE ORACULAIRE ── */
    #interpretation {
      max-width: 820px;
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      padding: 2rem 1.8rem;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #interpretation.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .interp-heading {
      text-align: center;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .interp-phrase {
      text-align: center;
      font-size: clamp(1.25rem, 2.8vw, 1.65rem);
      line-height: 1.55;
      padding: 1.2rem 1rem;
      margin-bottom: 1.8rem;
      border-top: 1px solid var(--gold-dim);
      border-bottom: 1px solid var(--gold-dim);
      background: rgba(255, 255, 255, 0.015);
    }

    .interp-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }

    @media (max-width: 740px) {
      .interp-cards {
        grid-template-columns: 1fr;
      }
    }

    .interp-card-detail {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.35rem;
    }

    .icd-pos {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .icd-symbol {
      font-size: 1.6rem;
      margin: 0.2rem 0;
    }

    .icd-name {
      font-size: 0.98rem;
      color: var(--gold-light);
    }

    .icd-fragment {
      font-size: 0.92rem;
      margin-top: 0.25rem;
    }
  </style>
</head>

      // ── COUPES ──

        pos1:"Le 2 de Coupe fait éclore",       pos2:"la convergence mutuelle",    pos3:"vers la communion" },

        pos1:"Le 4 de Coupe fait pousser",      pos2:"le mythe universel",         pos3:"collectivement" },

        pos1:"Le 5 de Coupe range",             pos2:"la stabilité",               pos3:"philosophale" },

        pos1:"Le 9 de Coupe rappelle",          pos2:"les souvenirs",              pos3:"inlassablement" },

      { roman:"V",  name:"Valet de Coupes",     symbol:"🏆", suit:"Coupes", suitColor:"#2a6496",
        pos1:"Le Valet de Coupe invite",        pos2:"le prochain",                pos3:"au banquet" },
      { roman:"C",  name:"Cavalier de Coupes",  symbol:"🏆", suit:"Coupes", suitColor:"#2a6496",
        pos1:"Le Cavalier de Coupe parade vers",pos2:"l'assemblée",                pos3:"dans l'empathie réciproque" },
      { roman:"R♀", name:"Reine de Coupes",     symbol:"🏆", suit:"Coupes", suitColor:"#2a6496",
        pos1:"La Reine de Coupe réconcilie",    pos2:"les antagonismes",           pos3:"de l'atavisme" },
      { roman:"R♂", name:"Roi de Coupes",       symbol:"🏆", suit:"Coupes", suitColor:"#2a6496",
        pos1:"Le Roi de Coupe éprouve",         pos2:"l'amour agape",              pos3:"par magnanimité" }
    ];

    const POS_LABELS = ["Le sujet agissant", "L'objet en jeu", "Le lieu & la manière"];
    const POS_KEYS   = ["pos1", "pos2", "pos3"];
    const FRAG_CLASS = ["frag-1", "frag-2", "frag-3"];

    let drawnCards = null;
    let flipped = [false, false, false];

    /**
     * Harmonise les jonctions grammaticales (contractions et élisions)
     * entre deux segments successifs tout en préservant leur séparation.
     */
    function lierSegments(segA, segB) {
      let a = segA.trim();
      let b = segB.trim();

      if (/\bde$/i.test(a)) {
        if (/^le\s+/i.test(b)) {
          return [a.replace(/\bde$/i, "du"), b.replace(/^le\s+/i, ""), false];
        }
        if (/^les\s+/i.test(b)) {
          return [a.replace(/\bde$/i, "des"), b.replace(/^les\s+/i, ""), false];
        }
        if (/^[aeiouyàâäéèêëîïôöùûüœæh]/i.test(b)) {
          return [a.replace(/\bde$/i, "d'"), b, true];
        }
      }

      if (/\bà$/i.test(a)) {
        if (/^le\s+/i.test(b)) {
          return [a.replace(/\bà$/i, "au"), b.replace(/^le\s+/i, ""), false];
        }
        if (/^les\s+/i.test(b)) {
          return [a.replace(/\bà$/i, "aux"), b.replace(/^les\s+/i, ""), false];
        }
      }

      return [a, b, false];
    }

    function drawCards() {
      document.getElementById('draw-btn').disabled = true;
      const pool = [...ARCANES];
      drawnCards = [];

      for (let i = 0; i < 3; i++) {
        const idx = Math.floor(Math.random() * pool.length);
        drawnCards.push(pool.splice(idx, 1)[0]);
      }

      flipped = [false, false, false];

      drawnCards.forEach((card, i) => {
        const bar = card.suitColor
          ? `<div style="position:absolute;top:0;left:0;right:0;height:4px;border-radius:9px 9px 0 0;background:${card.suitColor}"></div>`
          : '';
        const roman = card.suit ? `${card.roman} · ${card.suit}` : card.roman;

        document.getElementById(`face-${i}`).innerHTML = `
          ${bar}
          <span class="card-roman">${roman}</span>
          <span class="card-symbol">${card.symbol}</span>
          <span class="card-title">${card.name}</span>
        `;
        document.getElementById(`frag-${i}`).textContent = card[POS_KEYS[i]];
        document.getElementById(`slot-${i}`).classList.remove('flipped');
      });

      document.getElementById('interpretation').classList.remove('visible');
      document.getElementById('reset-btn').style.display = 'none';

      setTimeout(() => flipCard(0), 400);
      setTimeout(() => flipCard(1), 950);
      setTimeout(() => flipCard(2), 1500);
    }

    function flipCard(i) {
      if (!drawnCards || flipped[i]) return;
      flipped[i] = true;
      document.getElementById(`slot-${i}`).classList.add('flipped');
      if (flipped[0] && flipped[1] && flipped[2]) {
        setTimeout(showInterpretation, 700);
      }
    }

    function showInterpretation() {
      const [c0, c1, c2] = drawnCards;

      const [p1, p2Brut, noSpace12] = lierSegments(c0.pos1, c1.pos2);
      const [p2, p3, noSpace23]     = lierSegments(p2Brut, c2.pos3);

      const sep12 = noSpace12 ? '' : ' ';
      const sep23 = noSpace23 ? '' : ' ';

      document.getElementById('interp-text').innerHTML =
        `<span class="frag-1">${p1}</span>${sep12}` +
        `<span class="frag-2">${p2}</span>${sep23}` +
        `<span class="frag-3">${p3}</span>.`;

      document.getElementById('interp-cards').innerHTML = drawnCards.map((card, i) => `
        <div class="interp-card-detail">
          <span class="icd-pos">${POS_LABELS[i]}</span>
          <span class="icd-symbol">${card.symbol}</span>
          <span class="icd-name">${card.name}</span>
          <span class="icd-fragment ${FRAG_CLASS[i]}">${card[POS_KEYS[i]]}</span>
        </div>
      `).join('');

      const box = document.getElementById('interpretation');
      box.classList.add('visible');
      document.getElementById('reset-btn').style.display = 'inline-block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetReading() {
      drawnCards = null;
      flipped = [false, false, false];

      for (let i = 0; i < 3; i++) {
        document.getElementById(`slot-${i}`).classList.remove('flipped');
        document.getElementById(`frag-${i}`).textContent = '';
      }

      document.getElementById('interpretation').classList.remove('visible');
      document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('draw-btn').disabled = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
